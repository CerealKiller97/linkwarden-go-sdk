name: release

# Publishes a GitHub release for a version tag, with its notes taken from CHANGELOG.md.
# The tests run first, on the tagged commit, against the Linkwarden version pinned in
# .linkwarden-version, so the "Tested against Linkwarden" line in the notes is true.

on:
  push:
    tags: ["v*"]
  # Run by hand to (re)publish the release for a tag that already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  notes:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # A run started by hand names its tag as text, so check the tag is real before
      # checking it out: a missing tag otherwise fails checkout with an unclear error.
      - name: 🏷️ Check tag exists
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v1.2.3"
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "::error::Tag $TAG doesn't exist on GitHub. Create and push it first: git tag -a $TAG -m $TAG && git push origin $TAG"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # Fails early if CHANGELOG.md has no entry for the tag, or names a different
      # Linkwarden version than the one the tests use.
      - name: 📝 Check changelog entry
        run: scripts/release-notes.sh "$TAG"

  test:
    needs: notes
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: 🚀 Publish GitHub release
        run: |
          scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
